name: Build Haus NVR
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Install missing media test tools
        timeout-minutes: 8
        run: |
          if ! command -v ffmpeg >/dev/null; then
            if test -f /etc/apt/apt-mirrors.txt; then
              sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
          fi
      - name: Validate monitoring Compose profiles
        run: docker compose -f compose.monitoring.yaml -f compose.monitoring.host-telemetry.yaml config --quiet
        env:
          HAUS_NODE_KEY: fixture-only-monitoring-key-32-characters
          HAUS_HOST_TELEMETRY_DIRECTORY: /tmp
      - run: npm test
      - uses: actions/checkout@v7
        with:
          repository: resonaura/haus-helper
          # Fixed helper 0.3.19 baseline for playback repair and server policy integration.
          ref: 2f4aa4058a6f109f91248645145135b9d33d7d86
          path: integration-helper
      - run: npm ci --ignore-scripts --prefix integration-helper/haus-helper
      - run: npm run test:integration
        env:
          HAUS_HELPER_PATH: ${{ github.workspace }}/integration-helper/haus-helper
  image:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Allow camera frame burst buffers in native media regression checks
        run: sudo sysctl -w net.core.rmem_max=16777216
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/resonaura/haus-nvr
          flavor: suffix=-${{ matrix.arch }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=edge,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish native architecture manifest
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          docker buildx imagetools create --tag "ghcr.io/resonaura/haus-nvr:$version" --tag ghcr.io/resonaura/haus-nvr:edge "ghcr.io/resonaura/haus-nvr:$version-amd64" "ghcr.io/resonaura/haus-nvr:$version-arm64"
